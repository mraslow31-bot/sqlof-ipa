<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8106537563261740"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sqlof ipa</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f8; --card:#fff; --ink:#14161f; --muted:#667085; --line:#e1e4ec;
  --brand:#0a6cff; --brand-ink:#fff; --soft:#e8f0ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0e1118; --card:#171b25; --ink:#eef1f8; --muted:#97a1b5; --line:#262c3a;
  --brand:#4d93ff; --brand-ink:#0b1020; --soft:#1a2740;}}
:root[data-theme="dark"]{color-scheme:dark; --bg:#0e1118; --card:#171b25; --ink:#eef1f8; --muted:#97a1b5; --line:#262c3a; --brand:#4d93ff; --brand-ink:#0b1020; --soft:#1a2740;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;font-size:18px}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px 60px}
header{padding:34px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px;margin:0;font-weight:800;font-size:38px;line-height:1;direction:ltr}
.logo i{font-style:normal;width:58px;height:58px;border-radius:22%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:26px;font-weight:800}
.logo span{color:var(--brand)}
.count{font-size:16px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 16px;border-radius:99px}
.lead{margin:26px 0 0;font-size:clamp(32px,6vw,52px);font-weight:800;line-height:1.25}
.lead+p{margin:8px 0 0;color:var(--muted);font-size:19px}
.search{display:block;margin:28px 0 14px}
.search input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;font-size:18px}
.search input:focus{outline:3px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:500;cursor:pointer;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:99px;padding:8px 22px;font-size:17px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip:focus-visible,.dl:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.list{display:grid;gap:16px}
.app{display:grid;grid-template-columns:88px 1fr auto;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 22px}
.ic{width:88px;height:88px;border-radius:22%;display:grid;place-items:center;font-size:44px;background:var(--c,var(--brand));background-size:cover;background-position:center}
.nm{font-weight:800;font-size:23px;line-height:1.3}
.sm{color:var(--muted);font-size:16px}
.ds{color:var(--muted);font-size:16px;margin-top:3px}
.dl{font:inherit;font-weight:800;text-decoration:none;color:var(--brand);background:var(--soft);border-radius:99px;padding:11px 30px;font-size:18px;white-space:nowrap}
.dl:hover{background:var(--brand);color:var(--brand-ink)}
.empty{text-align:center;border:3px dashed var(--line);border-radius:22px;padding:48px 18px;background:var(--card)}
.empty b{display:block;font-size:22px;margin:8px 0 2px}
.empty p{margin:0;color:var(--muted)}
h2{font-size:22px;font-weight:800;margin:38px 0 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin:8px 0}
summary{cursor:pointer;font-weight:800;padding:10px 0}
details ol{margin:0 0 12px;padding-inline-start:22px;color:var(--muted)}
details li{margin:3px 0}
footer{margin-top:40px;text-align:center;color:var(--muted);font-size:16px}
.actions{margin-top:36px;text-align:center}
.btn{display:inline-block;background:#4CAF50;color:#fff;text-decoration:none;font-weight:800;font-size:19px;padding:15px 34px;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.social{margin:18px 0 0;font-size:18px;color:var(--muted)}
.social a{color:#E1306C;font-weight:800;text-decoration:none}
@media (max-width:480px){.app{grid-template-columns:68px 1fr;gap:14px;padding:16px}.ic{width:68px;height:68px;font-size:34px}.logo{font-size:32px}.dl{grid-column:1/-1;text-align:center}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo"><i>ipa</i><div>sqlof <span>ipa</span></div></h1>
    <span class="count" id="count">0 تطبيق</span>
  </header>
  <p class="lead">نزّل تطبيقات ipa لآيفونك</p>
  <p>اختر التطبيق ونزّل الملف.</p>

  <label class="search"><input id="q" type="search" placeholder="ابحث عن تطبيق" aria-label="ابحث عن تطبيق"></label>
  <div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
  <main class="list" id="list"></main>
  <div class="actions">
    <a class="btn" href="https://gofile.io/d/BEOYBN6u" target="_blank" rel="noopener">تحميل ملفات اللعبة</a>
    <p class="social">تابعني على انستغرام <a href="https://instagram.com/sqlof" target="_blank" rel="noopener">@sqlof</a></p>
  </div>
  <footer><a href="https://instagram.com/sqlof" target="_blank" rel="noopener" style="color:inherit; text-decoration:none;">sqlof ipa</a></footer>
</div>

<script>
/* ===== قائمة التطبيقات =====
   { name:"اسم التطبيق", version:"1.0", size:"25 MB", category:"أدوات",
     desc:"وصف قصير", emoji:"🛠️", color:"#0a6cff", icon:"رابط صورة (اختياري)",
     url:"رابط ملف ipa" }                                                  */
const APPS = [
  { name:"ملف المحاكي", category:"محاكيات", desc:"محاكي للآيفون", emoji:"🕹️", color:"#6a4cff", url:"https://gofile.io/d/tSzp7G2Y" }
];

const $ = id => document.getElementById(id);
let cat = "الكل", term = "";

function chips(){
  const cats = ["الكل", ...new Set(APPS.map(a => a.category).filter(Boolean))];
  $("chips").innerHTML = "";
  if (cats.length < 2) return;
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = c;
    b.setAttribute("aria-pressed", String(c === cat));
    b.onclick = () => { cat = c; chips(); render(); };
    $("chips").appendChild(b);
  });
}

function render(){
  const l = $("list"); l.innerHTML = "";
  $("count").textContent = APPS.length + " تطبيق";
  if (!APPS.length){
    l.innerHTML = '<div class="empty"><div style="font-size:54px">📦</div><b>لا توجد تطبيقات بعد</b><p>التطبيقات التي تُضاف ستظهر هنا.</p></div>';
    return;
  }
  const r = APPS.filter(a => (cat === "الكل" || a.category === cat) && a.name.toLowerCase().includes(term.toLowerCase()));
  if (!r.length){ l.innerHTML = '<div class="empty"><div style="font-size:54px">🔎</div><b>لا نتائج</b><p>جرّب كلمة أخرى أو تصنيفاً آخر.</p></div>'; return; }
  r.forEach(a => {
    const d = document.createElement("div"); d.className = "app";
    const ic = a.icon ? `style="background-image:url('${a.icon}')"` : `style="--c:${a.color || "var(--brand)"}"`;
    d.innerHTML = `<div class="ic" ${ic}>${a.icon ? "" : (a.emoji || "📱")}</div><div><div class="nm"></div><div class="sm"></div><div class="ds"></div></div><a class="dl" download>تنزيل</a>`;
    d.querySelector(".nm").textContent = a.name;
    d.querySelector(".sm").textContent = [a.version && "الإصدار " + a.version, a.size, a.category].filter(Boolean).join(" • ");
    d.querySelector(".ds").textContent = a.desc || "";
    d.querySelector(".dl").href = a.url || "#";
    l.appendChild(d);
  });
}
$("q").addEventListener("input", e => { term = e.target.value.trim(); render(); });
chips(); render();٠
</script>
</body>
</html>
